<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Spanish Flashcards</title>
  <link rel="stylesheet" href="style.css" />
</head>

<body>
<!-- Setup -->
<section id="setup" class="panel active">
  <div class="banner">
    <h1>¡Bienvenido!</h1>
    <p>
      Welcome to <strong>Spanish Flashcards</strong> — choose a chapter,
      start learning, or manage your vocabulary collection.
    </p>
  </div>

  <!-- 🎙️ Accent selector (first row) -->
  <div class="row accent-row">
    <div>
      <label for="voiceSelect">Choose Accent</label>
      <select id="voiceSelect">
        <option value="es-ES-Neural2-A">🇪🇸 Spanish (Spain) – Female</option>
        <option value="es-ES-Neural2-B">🇪🇸 Spanish (Spain) – Male</option>
        <option value="es-MX-Neural2-A">🇲🇽 Spanish (Mexico) – Female</option>
        <option value="es-MX-Neural2-B">🇲🇽 Spanish (Mexico) – Male</option>
        <option value="es-US-Neural2-A">🇺🇸 Spanish (US) – Female</option>
        <option value="es-US-Neural2-B">🇺🇸 Spanish (US) – Male</option>
      </select>
    </div>
  </div>

  <!-- 🧠 Chapter + Word count + Start session -->
  <div class="row session-row">
    <div>
      <label for="chapterSelect">Chapter</label>
      <select id="chapterSelect">
        <option value="">Select a chapter…</option>
      </select>
    </div>

    <div>
      <label for="wordCount">Number of words</label>
      <input type="number" id="wordCount" min="1" value="10" />
    </div>

    <div class="start-container">
      <button id="startBtn" class="btn start-btn">▶️ Start Session</button>
    </div>
  </div>

  <!-- 📚 View sessions & progress -->
  <div class="links-row" style="flex-direction: column;">
    <button id="viewLogsBtn" class="btn view-btn">📊 View Study Sessions</button>
    <a href="/progress.html" class="btn progress-btn">📈 View My Progress</a>
    <a href="/study.html" class="btn progress-btn">📚 Study Materials</a>
    <a href="/sentences.html" class="btn progress-btn">📖 Practice Sentences</a>
   <a href="/add.html" class="btn manage-btn">➕ Add or Manage Words</a>
  </div>


</section>


  <!-- Flashcard -->
  <section id="flashcard" class="panel">
    <div id="progress"></div>
    <div id="card" class="center">Loading…</div>
    <div id="translation" class="center"></div>
    <div class="center">
      <button id="speakBtn" class="btn" style="background: #3b82f6; color: #fff;">🔊 Speak</button>
      <button id="knowBtn" class="btn btn-know">I Know This</button>
      <button id="dontKnowBtn" class="btn btn-dontknow">I Don't Know This</button>
      <button id="nextBtn" class="btn btn-next">Next</button>
    </div>
  </section>

  <!-- Results -->
  <section id="results" class="panel">
    <h2>Session Finished 🎉</h2>
    <p id="score"></p>
    <button id="restartBtn" class="btn btn-primary">Restart</button>
  </section>

  <!-- Logs -->
  <section id="logs" class="panel">
    <h2>Progress Log 📊</h2>
    <div id="logsContainer">
      <p>Loading logs...</p>
    </div>
    <button id="backToSetupBtn" class="btn">Back to Home</button>
  </section>

  <script>
    let chapters = [];
    let sessionCards = [];
    let currentIndex = 0;
    let score = 0;
    let revealed = false;
    let currentChapter = null;
    let results = []; // ✅ store detailed per-word results

    function $(id) { return document.getElementById(id); }

    async function loadFlashcards() {
      const res = await fetch("/api/flashcards");
      chapters = await res.json();
      const select = $("chapterSelect");
      select.innerHTML = '<option value="">Select a chapter…</option>';
      chapters.forEach(ch => {
        const opt = document.createElement("option");
        opt.value = ch.chapter;
        opt.textContent = `Chapter ${ch.chapter}: ${ch.title} (${ch.totalWords} words)`;
        select.appendChild(opt);
      });
    }

    function startSession() {
      const chId = $("chapterSelect").value;
      const selected = chapters.find(c => c.chapter === chId);
      if (!selected) {
        alert("Please select a chapter first.");
        return;
      }
      currentChapter = selected;
      let count = parseInt($("wordCount").value) || 1;
      if (count > selected.words.length) count = selected.words.length;
      // ✅ Weighted selection: prefer unseen or weak words
      const weighted = [...selected.words].map(w => {
        const shown = w.shown_count || 0;
        const known = w.known_count || 0;
        const mastery = shown > 0 ? known / shown : 0;
        let weight = 1;

        // Unseen words: high priority
        if (shown === 0) weight = 5;
        // Weak words (<60% mastery): medium-high priority
        else if (mastery < 0.6) weight = 3;
        // Moderate mastery (60–80%)
        else if (mastery < 0.8) weight = 1.5;
        // Strong mastery (>80%): low priority
        else weight = 0.5;

        return { w, weight };
      });

      // Draw 'count' words using weighted probability
      const chosen = [];
      for (let i = 0; i < count; i++) {
        const totalWeight = weighted.reduce((a, b) => a + b.weight, 0);
        let r = Math.random() * totalWeight;
        for (const obj of weighted) {
          r -= obj.weight;
          if (r <= 0) {
            chosen.push(obj.w);
            // Reduce its weight to lower repeat chance
            obj.weight *= 0.3;
            break;
          }
        }
      }

      sessionCards = shuffle(chosen);

      currentIndex = 0; score = 0; results = []; // ✅ reset results
      showPanel("flashcard");
      showCard();
    }

    function showPanel(id) {
      ["setup", "flashcard", "results", "logs"].forEach(p => $(p).classList.remove("active"));
      $(id).classList.add("active");
    }

    function showCard() {
      if (currentIndex >= sessionCards.length) { return endSession(); }
      const card = sessionCards[currentIndex];
      $("progress").textContent = `Card ${currentIndex + 1} of ${sessionCards.length}`;
      $("card").textContent = card.es;
      $("translation").style.display = "none";
      $("translation").textContent = card.en;
      $("knowBtn").style.display = "inline-block";
      $("dontKnowBtn").style.display = "inline-block";
      $("nextBtn").style.display = "none";
      revealed = false;
    }

    function handleAnswer(isKnown) {
      if (!revealed) {
        $("translation").style.display = "block";

        // ✅ record this word’s outcome
        const currentWord = sessionCards[currentIndex];
        results.push({
          es: currentWord.es,
          en: currentWord.en,
          known: isKnown
        });

        if (isKnown) score++;
        $("knowBtn").style.display = "none";
        $("dontKnowBtn").style.display = "none";
        $("nextBtn").style.display = "inline-block";
        revealed = true;
      }
    }

    function nextCard() { currentIndex++; showCard(); }

    async function endSession() {
      // Calculate the score (e.g., how many were marked known)
      const score = results.filter(r => r.known).length;

      // Display a message to the user
      $("card").innerHTML = `
    ✅ Session complete!<br>
    You got <strong>${score}/${sessionCards.length}</strong> correct.<br><br>
    <button id="homeBtn" class="btn btn-primary">🏠 Back to Home</button>
  `;

      $("translation").style.display = "none";
      $("knowBtn").style.display = "none";
      $("dontKnowBtn").style.display = "none";
      $("nextBtn").style.display = "none";
      $("progress").textContent = "";


      // 🏠 add event listener for the new button
      document.getElementById("homeBtn").onclick = () => showPanel("setup");


      // Save the log entry to the backend
      try {
        await saveLogEntry();
        console.log("📗 Session logged successfully.");
      } catch (err) {
        console.error("❌ Failed to log session:", err);
      }
    }


    async function saveLogEntry() {
      if (!currentChapter) return;
      const now = new Date();
      const logData = {
        chapter: currentChapter.chapter,
        chapterTitle: currentChapter.title,
        score: score,
        totalCards: sessionCards.length,
        clientDate: now.toISOString().split('T')[0],
        clientTime: now.toTimeString().split(' ')[0],
        clientTimezone: Intl.DateTimeFormat().resolvedOptions().timeZone,
        wordsShown: results // ✅ send per-word data to backend
      };

      try {
        await fetch("/api/log", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify(logData)
        });
      } catch (error) {
        console.error("Error saving log entry:", error);
      }
    }

    function shuffle(a) { for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1));[a[i], a[j]] = [a[j], a[i]]; } return a; }

    async function showLogs() {
      showPanel("logs");
      try {
        const response = await fetch("/api/logs");
        const logs = await response.json();
        const container = $("logsContainer");
        if (logs.length === 0) {
          container.innerHTML = "<p>No session logs yet. Complete a flashcard session to see your progress!</p>";
          return;
        }

        logs.sort((a, b) => new Date(b.date + ' ' + b.time) - new Date(a.date + ' ' + a.time));

        let html = '<div style="overflow-x: auto;"><table style="width: 100%; border-collapse: collapse; margin-top: 16px;">';
        html += '<thead><tr style="background: var(--bg); border-bottom: 2px solid var(--accent);">';
        html += '<th style="padding: 12px; text-align: left;">Date</th>';
        html += '<th style="padding: 12px; text-align: left;">Time</th>';
        html += '<th style="padding: 12px; text-align: left;">Timezone</th>';
        html += '<th style="padding: 12px; text-align: left;">Chapter</th>';
        html += '<th style="padding: 12px; text-align: center;">Score</th>';
        html += '<th style="padding: 12px; text-align: center;">Percentage</th>';
        html += '<th style="padding: 12px; text-align: left;">IP Address</th>';
        html += '</tr></thead><tbody>';

        logs.forEach(log => {
          const percentage = log.percentage || Math.round((log.score / log.totalCards) * 100);
          const scoreColor = percentage >= 80 ? 'var(--success)' : percentage >= 60 ? '#f59e0b' : 'var(--danger)';
          html += `<tr style="border-bottom: 1px solid #e5e7eb;">
        <td style="padding: 12px;">${log.date}</td>
        <td style="padding: 12px;">${log.time}</td>
        <td style="padding: 12px; font-size: 12px; color: var(--muted);">${log.timezone || 'Unknown'}</td>
        <td style="padding: 12px;">${log.chapterTitle || '—'}</td>
        <td style="padding: 12px; text-align: center;">${log.score}/${log.totalCards}</td>
        <td style="padding: 12px; text-align: center; color: ${scoreColor}; font-weight: 600;">${percentage}%</td>
        <td style="padding: 12px; font-family: monospace; font-size: 14px;">${log.ipAddress || 'Unknown'}</td>
      </tr>`;
        });

        html += '</tbody></table></div>';
        container.innerHTML = html;
      } catch (error) {
        console.error("Error loading logs:", error);
        $("logsContainer").innerHTML = "<p>Error loading logs. Please try again.</p>";
      }
    }

    $("startBtn").onclick = startSession;
    $("knowBtn").onclick = () => handleAnswer(true);
    $("dontKnowBtn").onclick = () => handleAnswer(false);
    $("nextBtn").onclick = nextCard;
    $("restartBtn").onclick = () => location.reload();
    $("viewLogsBtn").onclick = showLogs;
    $("backToSetupBtn").onclick = () => showPanel("setup");

    // 🔊 Speak button
    // 🔊 Google TTS speak button with selectable voice
    $("speakBtn").onclick = async () => {
      const currentCard = sessionCards[currentIndex];
      if (!currentCard) return;

      const voiceSelect = document.getElementById("voiceSelect");
      const selectedVoice = voiceSelect ? voiceSelect.value : "es-ES-Neural2-A";
      const selectedLang = selectedVoice.startsWith("es-MX") ? "es-MX" :
        selectedVoice.startsWith("es-US") ? "es-US" : "es-ES";

      try {
        const res = await fetch("/api/tts", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ text: currentCard.es, lang: selectedLang, voiceName: selectedVoice })
        });
        const blob = await res.blob();
        const url = URL.createObjectURL(blob);
        const audio = new Audio(url);
        audio.play();
      } catch (err) {
        console.error("TTS error:", err);
      }
    };


    loadFlashcards();
  </script>
</body>

</html>
